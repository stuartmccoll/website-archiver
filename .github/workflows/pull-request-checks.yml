name: Pull request checks
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run that's in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Fails if any C# file doesn't follow .editorconfig. Run
      # `dotnet format` locally to fix.
      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Run tests
        run: dotnet test

  # Compiles the Bicep with the latest Bicep CLI, which the Azure CLI on
  # the runner downloads, so errors show up before the template is deployed
  bicep-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  # Builds the image the same way the deployment workflow does, but
  # without pushing it, so Dockerfile problems show up before merging
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag websitearchiver:ci WebsiteArchiver
