name: Publish image to GitHub Container Registry
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/websitearchiver

jobs:
  # Pull requests are already tested, but this also covers direct pushes
  # to main, so a broken image is never published
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version label overrides the one inherited from the base image
      # (the Ubuntu release), which ghcr.io would otherwise display
      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.version=${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            WebsiteArchiver

      - name: Push Docker image
        run: docker push --all-tags "$IMAGE"
