# Runs the archiver image against Azurite, the local Azure Storage emulator,
# so the Docker setup can be tested without a real Azure account.
#
# Usage (from this directory):
#   DOMAIN=https://example.com/ docker compose -f docker-compose.local.yml run --rm --build websitearchiver
#   docker compose -f docker-compose.local.yml run --rm list-blobs
#   docker compose -f docker-compose.local.yml down
#
# DOMAIN can also be set in .env. Nothing else is read from .env, so the
# real Azure connection string there is never used.

name: websitearchiver-local

x-azurite-connection-string: &azurite-connection-string
  # Azurite's fixed development account and key, which are public and
  # documented by Microsoft. They only work against the emulator.
  "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # The Azure SDK may use a newer storage API version than Azurite
    # recognises, so don't reject requests based on it.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck

  # Azurite starts empty, but the archiver expects its container to exist
  # already, as it does in Azure. Retries until Azurite is accepting
  # requests.
  create-container:
    image: mcr.microsoft.com/azure-cli:2.92.0
    depends_on:
      - azurite
    environment:
      AZURE_STORAGE_CONNECTION_STRING: *azurite-connection-string
    entrypoint:
      - sh
      - -c
      - |
        for attempt in $$(seq 30); do
          az storage container create --name archive --only-show-errors --output none && exit 0
          sleep 1
        done
        echo "Azurite didn't become available" >&2
        exit 1

  websitearchiver:
    build: .
    image: websitearchiver:local
    depends_on:
      create-container:
        condition: service_completed_successfully
    environment:
      # Not required here (":?") because Compose would then demand it for
      # every command, including down; the archiver reports it if missing.
      DOMAIN: ${DOMAIN:-}
      AZURE_BLOB_STORAGE_CONNECTION_STRING: *azurite-connection-string
      AZURE_BLOB_STORAGE_CONTAINER_NAME: archive

  # Lists what the archiver uploaded. Only runs when asked for by name.
  list-blobs:
    image: mcr.microsoft.com/azure-cli:2.92.0
    profiles: [tools]
    depends_on:
      - azurite
    environment:
      AZURE_STORAGE_CONNECTION_STRING: *azurite-connection-string
    command: az storage blob list --container-name archive --query "[].{name:name, size:properties.contentLength}" --output table --only-show-errors
